# yaml-language-server: $schema=../../packages/envio/evm.schema.json
# The same indexer kept in ClickHouse alone: the chain, contract and handlers
# of config.yaml, with every entity in ClickHouse and no Postgres at all.
name: e2e_test
description: E2E test indexer, ClickHouse alone
schema: ./schema.clickhouse-only.graphql
raw_events: true
disable_default_cross_chain: true
storage:
  postgres: false
  clickhouse: true
field_selection:
  transaction_fields:
    - "hash"
contracts:
  - name: ERC20
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
chains:
  - id: 1
    start_block: 10861674
    end_block: 10861774
    contracts:
      - name: ERC20
        address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984"
