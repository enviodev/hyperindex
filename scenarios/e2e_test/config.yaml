# yaml-language-server: $schema=../../packages/envio/evm.schema.json
name: e2e_test
description: E2E test indexer
raw_events: true
# Existing entities keep their cross-chain behavior via @crossChain; the
# ChainTransfer/ChainAccount pair is what exercises the per-chain mode.
disable_default_cross_chain: true
storage:
  postgres:
    column_name_format: snake_case
  clickhouse: true
field_selection:
  transaction_fields:
    - "hash"
contracts:
  - name: ERC20
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
chains:
  - id: 1
    start_block: 10861674
    end_block: 10861774
    contracts:
      - name: ERC20
        address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984"
# Written by config.yaml, not by a handler. No `as_entity`, so it stays out of
# the handler context — and out of Hasura's `_by_pk` root, which only makes
# sense for a table whose ids a caller can name.
tables:
  transfer_totals:
    storage:
      postgres: true
      clickhouse: false
    from: evm.events
    where:
      contractName: ERC20
      eventName: Transfer
    select:
      id: params.to
      received:
        _sum: params.value
        _description: "Total received by this account"
  # No `where` at all, so every configured event feeds this table — which
  # works because `select` reads nothing event-specific. Leading underscores
  # keep it out of the way alphabetically; generated code reaches it as
  # `Block_totals`. Its id is an Int, so the reference below carries an Int.
  _block_totals:
    storage:
      postgres: true
      clickhouse: false
    from: evm.events
    select:
      id: block.number
      transfers:
        _sum: 1
  transfer_blocks:
    storage:
      postgres: true
      clickhouse: false
    from: evm.events
    where:
      contractName: ERC20
      eventName: Transfer
    select:
      id:
        _concat:
          separator: "-"
          values:
            - transaction.hash
            - logIndex
      block:
        _ref:
          table: _block_totals
          id: block.number
