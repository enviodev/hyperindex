# Hash comments are ignored by the GraphQL parser and should NOT appear
# in introspection. Only string descriptions ("""...""" or "...") are exposed.

"An ERC-20 transfer event"
type Transfer @crossChain @storage(postgres: true, clickhouse: true) {
  "Composite ID built from chainId-block-logIndex"
  id: ID!
  "Sender address"
  from: String! @index
  "Recipient address"
  to: String! @index
  "Token amount transferred (raw, no decimals applied)"
  value: BigInt!
  "Block number the transfer was emitted in"
  blockNumber: Int!
  "Hash of the transaction that emitted the transfer"
  transactionHash: String!
}

"An on-chain account participating in transfers"
type Account @crossChain @storage(postgres: true) {
  "The account's Ethereum address"
  id: ID!
  "All transfers sent from this account"
  outgoing: [Transfer!]! @derivedFrom(field: "from")
}

# Override the global multi-storage default: this entity only lives in
# Postgres. ClickHouse will not receive writes for it.
type TransferPgOnly @crossChain @storage(postgres: true) {
  id: ID!
  from: String!
  value: BigInt!
}

# Mirror override: this entity only lives in ClickHouse, so it is
# absent from the Postgres-backed `pgUserEntities` (and from Hasura).
type TransferChOnly @crossChain @storage(clickhouse: true) {
  id: ID!
  from: String!
  value: BigInt!
}

# NUMERIC[] columns are created as TEXT[] when Hasura is enabled, so Hasura
# returns the elements as strings rather than numbers that lose precision.
# https://github.com/enviodev/hyperindex/issues/788
type NumericArrays @crossChain @storage(postgres: true) {
  id: ID!
  bigInts: [BigInt!]!
  bigDecimals: [BigDecimal!]!
}

# Per-chain entities: their tables carry a chain-id column in the primary key,
# spelled per backend (snake_case in Postgres, original in ClickHouse). The
# relationship between them must join on the chain too, or Hasura would resolve
# it to another chain's row with the same id.
type ChainTransfer @storage(postgres: true, clickhouse: true) {
  id: ID!
  from: String! @index
  value: BigInt!
}

type ChainAccount @storage(postgres: true) {
  id: ID!
  transfers: [ChainTransfer!]! @derivedFrom(field: "from")
}
