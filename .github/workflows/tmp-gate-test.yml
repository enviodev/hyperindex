name: TEMP gate test (remove before merge)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: |-
      ${{
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name != github.repository &&
        'fork-ci' || 'internal'
      }}
    steps:
      - run: echo "Authorized"
  enable-coderabbit:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'coderabbit')
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["coderabbit"],
            });
  authorize-rejected:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: exit 1
  enable-coderabbit-after-rejection:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'coderabbit')
    needs: authorize-rejected
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["coderabbit"],
            });
