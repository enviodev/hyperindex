name: Announce release to Discord

on:
  release:
    types: [published]
  # Render a past release on demand, so the message can be checked without
  # waiting for a real one. Defaults to printing the message in the job log
  # rather than sending it. Release events ignore both inputs and always send.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to render, for example v3.0.0'
        required: true
      dry_run:
        description: 'Print the message in the log instead of sending it'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == false
    steps:
      # Announce major and minor releases only. A release qualifies when the
      # tag is an exact "X.Y.0" (strip a leading "v"): patch is 0, and there is
      # no pre-release suffix. This skips patch releases and release candidates
      # such as v3.0.0-rc.1, which GitHub does not always flag as prereleases.
      # (Same gate as .github/workflows/telegram-release.yml.)
      - name: Check if release is major or minor
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # A manual run has no release payload, so read the flag off the tag to
          # keep the gate identical to a real release.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            IS_PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease -q .isPrerelease)"
          fi
          version="${TAG#v}"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "$TAG is a prerelease; skipping"
            echo "announce=false" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            echo "$TAG is a major/minor release; announcing"
            echo "announce=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is a patch release; skipping"
            echo "announce=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.classify.outputs.announce == 'true'
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post release to Discord
        if: steps.classify.outputs.announce == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          INPUT_TAG: ${{ inputs.tag }}
          # Gate on the event, not just the input. dry_run defaults to true, and
          # a release must never inherit that default and go quiet.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" > "$RUNNER_TEMP/release.json"
          else
            jq .release "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/release.json"
          fi
          node .github/scripts/discord-release.mjs "$RUNNER_TEMP/release.json"
