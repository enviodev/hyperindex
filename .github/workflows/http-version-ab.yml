name: HTTP version A/B

# Temporary: compares HTTP/1.1 and HTTP/2 to HyperSync from runners with a
# direct route, on open indexer benchmark cases. Delete with its branch.
on:
  push:
    branches:
      - claude/http-version-ab

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get install -y -qq nghttp2-client > /dev/null
      - name: What the servers negotiate and announce
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
        run: |
          for host in solana.hypersync.xyz 1.hypersync.xyz eth.hypersync.xyz; do
            echo "::group::$host"
            echo "--- DNS"; getent ahosts "$host" | awk '{print $1}' | sort -u
            echo "--- curl HTTP/2"
            curl -sS -o /dev/null -D - --http2 -H "Authorization: Bearer $ENVIO_API_TOKEN" \
              -w 'negotiated=%{http_version} ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s\n' \
              "https://$host/height"
            echo "--- curl HTTP/1.1"
            curl -sS -o /dev/null -D - --http1.1 -H "Authorization: Bearer $ENVIO_API_TOKEN" \
              -w 'negotiated=%{http_version} ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s\n' \
              "https://$host/height"
            echo "--- server SETTINGS and WINDOW_UPDATE frames"
            nghttp -nv -H "authorization: Bearer $ENVIO_API_TOKEN" "https://$host/height" 2>&1 \
              | grep -E "SETTINGS|SETTINGS_|WINDOW_UPDATE|window_size_increment|ALPN|recv \(stream_id=[0-9]+\) (server|via|alt-svc|cf-|x-)" | head -40
            echo "::endgroup::"
          done

  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [solana-spl-transfers, erc20-transfer-events]
        job: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: envio-dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: ./.github/actions/cargo-cache

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build release addon
        env:
          SVM_TARGET_PLATFORM: linux-amd64
        run: cargo build --release --lib

      - name: Compile the envio runtime
        working-directory: packages/envio
        run: pnpm install && pnpm rescript

      - name: Clone the benchmark
        run: git clone --depth 1 https://github.com/enviodev/open-indexer-benchmark "$RUNNER_TEMP/bench"

      - name: Warm-up, then h1 h2 h2big h2big h2 h1
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
        run: .github/http-ab/run.sh "${{ matrix.case }}" "${{ matrix.job }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.case }}-${{ matrix.job }}
          path: ${{ runner.temp }}/out
