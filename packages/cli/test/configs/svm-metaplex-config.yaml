# yaml-language-server: $schema=../../../envio/svm.schema.json
name: Solana indexer
ecosystem: svm
chains:
  - id: solana
    start_block: 200000000
    experimental:
      hypersync_config:
        url: https://solana.hypersync.xyz
      programs:
        - name: TokenMetadata
          program_id: metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s
          instructions:
            - name: CreateMetadataAccountV3
              discriminator: "0x21"
              accounts:
                - metadata
                - mint
                - mint_authority
                - payer
                - update_authority
                - system_program
                - rent
              args: []
            - name: UpdateMetadataAccountV2
              discriminator: "0x0f"
              accounts:
                - metadata
                - update_authority
              args: []
