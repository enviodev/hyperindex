# yaml-language-server: $schema=../../../envio/evm.schema.json
name: json-bigint-events-config
schema: ../schemas/schema.graphql
description: Tuple event params holding bigints, which contract-import converts for their Json entity fields
chains:
  - id: 1
    rpc:
      url: https://eth.com
      for: sync
    start_block: 0
    contracts:
      - name: WXTZ
        handler: ./src/EventHandler.js
        address: "0xc9B53AB2679f573e480d01e0f49e2B5CFB7a3EAb"
        events:
          # https://github.com/enviodev/hyperindex/issues/1678
          - event: EnforcedOptionSet((uint32,uint16,bytes)[] _enforcedOptions)
          - event: PeerSet((address peer, string label) info)
          - event: BatchSent((uint256 amount, (uint64 at, bool done)[] steps)[] items, uint256 total)
