#test schema for per-entity ClickHouse table options

type Transfer @storage(clickhouse: {
  partitionBy: "toYYYYMM(timestamp)",
  orderBy: ["timestamp"],
  ttl: "timestamp + INTERVAL 2 YEAR",
  skippingIndexes: [
    { name: "idx_from", expr: "fromAddress", type: "bloom_filter(0.01)", granularity: 4 },
    { name: "idx_amount", expr: "amount", type: "minmax" }
  ]
}) {
  id: ID!
  fromAddress: String!
  timestamp: Timestamp!
  amount: BigInt!
}

type Account @storage(postgres: true, clickhouse: true) {
  id: ID!
}
