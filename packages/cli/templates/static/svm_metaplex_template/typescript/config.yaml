# yaml-language-server: $schema=./node_modules/envio/svm.schema.json
name: solana-metaplex-token-metadata
description: Indexes Metaplex Token Metadata creates and updates on Solana mainnet via HyperSync.
ecosystem: svm
chains:
  - id: solana
    start_slot: 417920000
programs:
  - name: TokenMetadata
    program_id: metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s
    instructions:
      - name: CreateMetadataAccountV3
        discriminator: "0x21"
        accounts:
          - metadata
          - mint
          - mint_authority
          - payer
          - update_authority
          - system_program
          - rent
      - name: UpdateMetadataAccountV2
        discriminator: "0x0f"
        accounts:
          - metadata
          - update_authority

