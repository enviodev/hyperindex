# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: erc20-indexer
description: ERC-20 Indexer
# Tables and effect caches are per-chain: the same id on two chains is two
# independent rows. Required by `tables`, since two chains' UNI balances must
# not merge into one row. Opt a single table back into a shared row with
# `cross_chain: true`, or an effect with `crossChain: true`.
disable_default_cross_chain: true
contracts:
  - name: ERC20
    events:
      - event: "Approval(address indexed owner, address indexed spender, uint256 value)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
chains:
  - id: 1 # Ethereum Mainnet
    start_block: 0
    contracts:
      - name: ERC20
        address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984" # UNI
  - id: 100 # Gnosis Mainnet
    start_block: 0
    contracts:
      - name: ERC20
        address: "0x4537e328Bf7e4eFA29D05CAeA260D7fE26af9D74" #UNI
# `tables` owns both the schema and the writes, so this indexer needs no
# schema.graphql and no handlers. Every column's type is inferred from the
# events it reads, and each event fetches only the fields its tables select.
tables:
  accounts:
    with:
      balance_changes:
        # Approval owners should exist even if they have never transferred.
        - from: evm.events
          where:
            contractName: ERC20
            eventName: Approval
          select:
            account: params.owner
            delta: 0
        # Also create the spender because approvals.spender is non-null.
        - from: evm.events
          where:
            contractName: ERC20
            eventName: Approval
          select:
            account: params.spender
            delta: 0
        # Debit the sender.
        - from: evm.events
          where:
            contractName: ERC20
            eventName: Transfer
          select:
            account: params.from
            delta:
              _negate: params.value
        # Credit the receiver.
        - from: evm.events
          where:
            contractName: ERC20
            eventName: Transfer
          select:
            account: params.to
            delta: params.value
    from: balance_changes
    select:
      id: account
      # A reducer, so a self-transfer's debit and credit cancel instead of
      # racing two writes against the same row.
      balance:
        _sum: delta
      approvals:
        _derived_from: approvals.owner
  approvals:
    from: evm.events
    where:
      contractName: ERC20
      eventName: Approval
    select:
      # Fixed-width addresses, so `-` can't produce an ambiguous id.
      id:
        _concat:
          separator: "-"
          values:
            - params.owner
            - params.spender
      amount: params.value
      owner:
        _ref:
          table: accounts
          id: params.owner
      spender:
        _ref:
          table: accounts
          id: params.spender
