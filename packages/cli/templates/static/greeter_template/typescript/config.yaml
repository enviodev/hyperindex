# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: Greeter
description: Greeter indexer
# Entities and effect caches are per-chain: the same id on two chains is two
# independent rows. Recommended for multichain indexers since v3.6.0. Opt a
# single entity back into a shared row with `@crossChain` in schema.graphql, or
# an effect with `crossChain: true`.
disable_default_cross_chain: true
#Global contract definitions that must contain all definitions except
#addresses. Now you can share a single handler/abi/event definitions
#for contracts across multiple chains
contracts:
  - name: Greeter
    abi_file_path: ./abis/greeter-abi.json
    events:
      - event: NewGreeting
      - event: ClearGreeting
chains:
  - id: 137 # Polygon
    start_block: 45336336
    contracts:
      - name: Greeter #A reference to the global contract definition
        address: "0x9D02A17dE4E68545d3a58D3a20BbBE0399E05c9c"
  - id: 59144 # Linea
    start_block: 367801
    contracts:
      - name: Greeter #A reference to the global contract definition
        address: "0xdEe21B97AB77a16B4b236F952e586cf8408CF32A"
